# Production docker-compose override (Container & Deployment Hardening Standard v1).
# Layered on the base file:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up -d
#
# Front the container with a reverse proxy (TLS at the edge); see
# docker-compose.npm.yml for the Nginx Proxy Manager expose-only overlay.

services:
  metadome-link:
    environment:
      METADOME_LINK_TRANSPORT: unified
      METADOME_LINK_LOG_LEVEL: INFO
      METADOME_LINK_LOG_FORMAT: json
      METADOME_LINK_ALLOWED_HOSTS: '["localhost","127.0.0.1","::1","metadome-link.genefoundry.org"]'
      METADOME_LINK_ALLOWED_ORIGINS: '["https://metadome-link.genefoundry.org"]'
      METADOME_LINK_CORS_ORIGINS: '["https://metadome-link.genefoundry.org"]'
      # Keep the SQLite result cache on the writable volume (read-only rootfs).
      METADOME_LINK_CACHE__DB_PATH: /app/data/metadome_cache.sqlite

    # No published host ports in production; reach the container via the proxy only.
    # !reset (not []) is required: Compose MERGES list fields across -f overlays,
    # so a plain `ports: []` would NOT drop the base file's host mapping.
    ports: !reset []

    # Read-only root filesystem; writes confined to the named cache volume
    # (/app/data, inherited from the base file) and an ephemeral tmpfs.
    read_only: true
    tmpfs:
      - /tmp/metadome-link:rw,noexec,nosuid,size=64m,mode=1777

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    pids_limit: 256
    init: true

    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
          pids: 256
        reservations:
          memory: 128M
          cpus: "0.25"
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

    # No bulk download — the server starts immediately after uvicorn binds.
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "Host: localhost", "http://127.0.0.1:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=metadome-link,environment=production"
