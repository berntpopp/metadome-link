name: metadome-link

services:
  metadome-link:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    container_name: metadome-link
    # Dev/local only — loopback-bound (127.0.0.1) so copying this file to a
    # server never publishes the unauthenticated backend on the public IP
    # (Docker would otherwise bind 0.0.0.0 and bypass the host firewall).
    # Production fronts the container with a reverse proxy via the prod/npm
    # overlays (ports: !reset []). Backends are unauthenticated by design.
    ports:
      - "127.0.0.1:${METADOME_LINK_HOST_PORT:-8000}:8000"
    env_file:
      - path: ../.env
        required: false
      - path: ../.env.docker
        required: false
    environment:
      METADOME_LINK_TRANSPORT: unified
      METADOME_LINK_HOST: 0.0.0.0
      # Explicit opt-in for the F-04 bind guard: the container binds 0.0.0.0 but
      # is only published on loopback above (127.0.0.1:...), so this is safe.
      METADOME_LINK_ALLOW_PUBLIC_BIND: "true"
      METADOME_LINK_PORT: "8000"
      METADOME_LINK_MCP_PATH: /mcp
      METADOME_LINK_ALLOWED_HOSTS: '["localhost","127.0.0.1","::1"]'
      METADOME_LINK_LOG_LEVEL: INFO
      METADOME_LINK_LOG_FORMAT: json
      METADOME_LINK_CACHE__DB_PATH: /app/data/metadome_cache.sqlite
    volumes:
      # Persist the SQLite result cache across container restarts so already-
      # computed tolerance landscapes are served instantly on repeat requests.
      - metadome-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "Host: localhost", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Short start-period: no bulk download needed; server starts immediately.
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - metadome-network

volumes:
  metadome-data:
    driver: local

networks:
  metadome-network:
    driver: bridge
