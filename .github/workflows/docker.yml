name: Docker

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docker/**"
      - "metadome_link/**"
      - "mcp_server.py"
      - "server.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  push:
    branches:
      - main
    paths:
      - "docker/**"
      - "metadome_link/**"
      - "mcp_server.py"
      - "server.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".dockerignore"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-compose:
    name: Validate Compose config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Render base compose
        run: docker compose -f docker/docker-compose.yml config

  build-image:
    name: Build production image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # Build only — the image ships no pre-built data; the SQLite result cache
      # is populated lazily from the live MetaDome API at request time.
      # No registry push here.
      - name: Build
        run: docker build -f docker/Dockerfile -t metadome-link:ci .
