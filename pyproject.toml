[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metadome-link"
version = "0.3.3"
description = "MCP/API server wrapping the MetaDome web service for missense tolerance landscapes, Pfam domains, and meta-domain variant aggregation"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "metadome-link contributors", email = "bernt.popp@charite.de" },
]
keywords = [
    "metadome", "tolerance", "dn-ds", "missense", "protein", "domain",
    "meta-domain", "mcp", "api", "bioinformatics", "variant", "gnomad", "clinvar",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
# 3.12 is the supported FLOOR, not the shipped interpreter. The container ships
# CPython 3.14 (docker/Dockerfile) and CI tests both ends of the range, so the
# interpreter that ships is always one CI has exercised.
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.52.0,<1.0.0",
    "pydantic>=2.11.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "httpx>=0.28.0,<1.0.0",
    "structlog>=24.4.0,<27.0.0",
    "orjson>=3.10.0,<4.0.0",
    "rich>=13.0.0,<16.0.0",
    "typer>=0.27.1,<1.0.0",
    "mcp[cli]>=1.27.0,<2.0.0",
    "fastmcp>=3.4.4,<4.0.0",
    "async-lru>=2.0.0,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<10.0.0",
    "pytest-asyncio>=0.24.0,<2.0.0",
    "pytest-cov>=5.0.0,<8.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "pytest-xdist>=3.6.0,<4.0.0",
    "respx>=0.21.0,<1.0.0",
    "ruff>=0.8.0,<1.0.0",
    "mypy>=1.13.0,<3.0.0",
    "pre-commit>=4.0.0,<5.0.0",
]

[project.urls]
Homepage = "https://github.com/berntpopp/metadome-link"
Repository = "https://github.com/berntpopp/metadome-link"
"Bug Tracker" = "https://github.com/berntpopp/metadome-link/issues"

[project.scripts]
metadome-link = "server:main"
metadome-link-mcp = "mcp_server:main"
metadome-link-cache = "metadome_link.cache.store:main"

[tool.hatch.build.targets.wheel]
packages = ["metadome_link"]
include = ["server.py", "mcp_server.py"]

[tool.ruff]
line-length = 100
# Tracks the `requires-python` FLOOR (3.12), not the shipped interpreter (3.14):
# targeting py314 here would let the `UP` rules rewrite code into 3.14-only
# syntax that the declared 3.12 floor could not run.
target-version = "py312"

[tool.ruff.lint]
# `select` (not `extend-select`): ruff 0.16 grows the implicit default rule set
# from 59 to 413 rules, so `extend-select` would silently inherit ~350 unopted
# rules. This list is already a superset of the pre-0.16 default (E4/E7/E9 + F),
# so the effective policy is byte-identical -- it is now explicit and pinned.
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "S", "T20", "SIM", "RUF",
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "B008",   # FastAPI Query/Depends pattern
    "S101",   # asserts ok in tests (also per-file-ignores)
    "N812",   # single-letter module aliases
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101", "S104", "S110", "T20", "B011", "SIM105", "SIM108"]
"mcp_server.py" = ["T20"]
"scripts/**/*" = ["T20"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
# Deliberately UNPINNED. A pinned `python_version` would type-check one end of the
# supported range on every job; without it mypy checks whatever interpreter runs
# it, so the CI matrix checks the 3.12 floor as 3.12 and the shipped 3.14
# container interpreter as 3.14 -- including symbols removed in 3.13/3.14.
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
exclude = [
    ".*site-packages.*",
    ".*/\\.venv/.*",
    "htmlcov/.*",
]

[[tool.mypy.overrides]]
module = [
    "structlog.*",
    "mcp.*",
    "fastmcp.*",
    "fastapi.*",
    "pydantic.*",
    "pydantic_settings.*",
    "httpx.*",
    "uvicorn.*",
    "typer.*",
    "async_lru.*",
    "respx.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that hit the live MetaDome web API",
    "unit: marks tests as unit tests",
    "mcp: marks tests that test MCP functionality",
]

[tool.coverage.run]
source = ["metadome_link"]
omit = ["tests/*", "*/.venv/*"]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true

[tool.coverage.html]
directory = "htmlcov"
